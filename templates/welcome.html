<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos - La Selva del Prado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { margin: 0; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #1abc9c 0%, #0e6655 100%); color: white; text-align: center; position: relative; }
        .hero { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); max-width: 90%; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; }
        p { font-size: 1.2rem; margin-bottom: 30px; }
        .btn { background-color: #f39c12; color: white; padding: 15px 30px; font-size: 1.2rem; text-decoration: none; border-radius: 30px; font-weight: 600; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); transition: transform 0.2s; display: inline-block;}
        .btn:hover { transform: scale(1.05); }
        .admin-btn { position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.15); color: rgba(255, 255, 255, 0.8); text-decoration: none; padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; transition: all 0.3s ease; }
        .admin-btn:hover { background: rgba(0, 0, 0, 0.4); color: white; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🌿 La Selva del Prado</h1>
        <p>Los mejores sabores amazónicos directo a tu mesa</p>
        <a href="/login-mesa" class="btn">Empezar a Pedir</a>
    </div>
    <a href="/admin-login" class="admin-btn">🔒 Admin</a>
</body>
</html>
