<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Admin - La Selva del Prado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .admin-card { background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: 'Poppins'; box-sizing: border-box; }
        button { width: 100%; background-color: #34495e; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #1a252f; }
        .flash { color: #e74c3c; margin-bottom: 15px; font-size: 0.9rem; }
        .btn-volver { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .btn-volver:hover { color: #1abc9c; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>🔒 Panel de Control</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/admin-login" method="POST">
            <input type="password" name="password" placeholder="Clave maestra" required>
            <button type="submit">Ingresar</button>
        </form>
        <a href="/" class="btn-volver">⬅ Volver al inicio</a>
    </div>
</body>
</html>
