<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login Admin</title>
</head>
<body style="background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="card bg-dark text-white p-4 shadow" style="width: 350px; border-radius: 15px;">
        <h4 class="text-center mb-4 text-success fw-bold">🔐 Acceso de Jefe</h4>
        {% with messages = get_flashed_messages() %}
            {% if messages %}{% for message in messages %}<div class="alert alert-danger p-2 small text-center">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="pass" class="form-control mb-4 text-center" placeholder="Clave de administrador" required>
            <button class="btn btn-success w-100 fw-bold">INGRESAR AL PANEL</button>
        </form>
        <div class="text-center mt-3"><a href="/" class="text-muted text-decoration-none">← Cancelar</a></div>
    </div>
</body>
</html>
