<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | La Selva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121c13; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; position: relative; margin: 0; }
        .btn-volver { position: absolute; top: 25px; left: 25px; color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 600; font-size: 1.1rem; transition: 0.3s; padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-volver:hover { background: rgba(255,255,255,0.1); color: white; }
        .admin-card { background: white; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2; }
    </style>
</head>
<body>
    <a href="/" class="btn-volver">← Volver al inicio</a>
    <div class="admin-card text-center">
        <h2 class="fw-bold mb-2 text-dark">🔐 Acceso de Jefe</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/admin-login" method="POST">
            <input type="password" name="password" class="form-control mb-3 py-2" placeholder="Clave de administrador" required>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">INGRESAR AL PANEL</button>
        </form>
    </div>
</body>
</html>
