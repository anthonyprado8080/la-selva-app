<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Recibido!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;}
        .success-card { background: white; border-radius: 20px; padding: 3rem 2rem; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; width: 90%; }
        .icon-check { font-size: 5rem; color: #2b5726; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="success-card">
        <i class="bi bi-check-circle-fill icon-check"></i>
        <h2 class="fw-bold text-dark mb-3">¡Pedido Enviado!</h2>
        <p class="text-muted mb-4">Nuestra cocina ya está preparando tu orden para la <strong>Mesa {{ mesa_numero }}</strong>. En breve te estaremos atendiendo.</p>
        <a href="/carta" class="btn btn-outline-dark rounded-pill px-4">Volver al Menú</a>
    </div>
</body>
</html>
