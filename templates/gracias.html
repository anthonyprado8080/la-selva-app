<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Confirmado! - La Selva del Prado</title>
    {% include '_theme.html' %}
    <style>
        .aro { stroke-dasharray: 152; stroke-dashoffset: 152; animation: trazo .8s ease-out forwards; }
        .aro-oro { stroke-dasharray: 165; stroke-dashoffset: 165; animation: trazo 1s .15s ease-out forwards; }
        .marca { stroke-dasharray: 40; stroke-dashoffset: 40; animation: trazo .4s .7s ease-out forwards; }
        @keyframes trazo { to { stroke-dashoffset: 0; } }
        .latido { animation: latido .5s .75s ease-out; }
        @keyframes latido { 50% { transform: scale(1.1); } }
        .cuenta-atras { transform-origin: left; animation: cuentaAtras 10s linear forwards; }
        @keyframes cuentaAtras { to { transform: scaleX(0); } }
        @media (prefers-reduced-motion: reduce) { .aro, .aro-oro, .marca { stroke-dashoffset: 0; } .cuenta-atras { animation: cuentaAtras 10s linear forwards !important; animation-duration: 10s !important; } }
    </style>
</head>
<body class="selva-bg min-h-screen text-hueso font-sans antialiased flex items-center justify-center p-4 overflow-x-hidden">
    <main class="glass entrada w-full max-w-lg rounded-[2rem] p-8 sm:p-10 text-center shadow-alta">
        <svg class="latido w-28 h-28 mx-auto" viewBox="0 0 60 60" fill="none" aria-hidden="true">
            <circle class="aro-oro" cx="30" cy="30" r="26.5" stroke="#e8c790" stroke-width="1.2"/>
            <circle class="aro" cx="30" cy="30" r="24" stroke="#1f9d6b" stroke-width="3"/>
            <path class="marca" d="M19 31l8 8 15-16" stroke="#6fd8a9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="mt-6 text-xs font-semibold tracking-[.3em] uppercase text-ambar-300">Mesa {{ "%02d"|format(mesa_numero) }}</p>
        <h1 class="font-display text-5xl sm:text-6xl leading-none mt-3">¡Pedido <em class="text-ambar-300">en marcha!</em></h1>
        <p class="mt-5 text-selva-200">Tu orden ya está en cocina. En breve te estaremos atendiendo.</p>

        <div class="mt-8 grid gap-3">
            <a href="/carta" class="brillo rounded-2xl bg-ambar-500 text-selva-950 font-bold py-4 hover:bg-ambar-300 focus:outline-none focus-visible:ring-4 focus-visible:ring-hueso"><i class="fa-solid fa-utensils mr-2" aria-hidden="true"></i>Pedir algo más</a>
            <a href="/logout" class="rounded-2xl border border-white/25 font-semibold py-4 hover:bg-white/10 transition focus:outline-none focus-visible:ring-4 focus-visible:ring-ambar-300"><i class="fa-solid fa-right-from-bracket mr-2" aria-hidden="true"></i>Cerrar sesión de la mesa</a>
        </div>

        <div class="mt-7 h-1 rounded-full bg-white/10 overflow-hidden" aria-hidden="true"><div class="cuenta-atras h-full bg-esmeralda-500"></div></div>
        <p class="mt-2 text-xs text-selva-200/80">Volverás a la carta en unos segundos.</p>
    </main>
    <script>
        setTimeout(() => { location.href = '/carta'; }, 10000);
    </script>
</body>
</html>
