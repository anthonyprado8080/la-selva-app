<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Recibido</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        body { margin: 0; font-family: 'Poppins', sans-serif; background-color: #e8f8f5; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 90%; }
        h1 { color: #1abc9c; font-size: 3rem; margin: 0 0 10px 0; }
        h2 { color: #2c3e50; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .btn { background-color: #1abc9c; color: white; padding: 15px 30px; text-decoration: none; border-radius: 10px; font-weight: 600; box-shadow: 0 4px 15px rgba(26, 188, 156, 0.3); }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅</h1>
        <h2>¡Pedido Enviado a Cocina!</h2>
        <p>Mesa {{ mesa_numero }}, en breve le llevaremos su orden.</p>
        <a href="/carta" class="btn">Pedir algo más</a>
    </div>
</body>
</html>
