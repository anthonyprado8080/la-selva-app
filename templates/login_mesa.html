<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Mesa | La Selva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920&auto=format&fit=crop'); background-size: cover; background-position: center; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; position: relative; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 28, 19, 0.6); z-index: 1; }
        .btn-volver { position: absolute; top: 25px; left: 25px; color: white; text-decoration: none; font-weight: 600; font-size: 1.1rem; z-index: 10; transition: 0.3s; padding: 8px 15px; border-radius: 8px; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); }
        .btn-volver:hover { background: rgba(255,255,255,0.2); color: white; }
        .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 2.5rem; width: 90%; max-width: 400px; z-index: 2; box-shadow: 0 15px 35px rgba(0,0,0,0.2); color: white; text-align: center; }
        .login-card h1 { font-family: 'Playfair Display', serif; color: #D4A373; margin-bottom: 0.5rem; }
        .form-control { background: rgba(255, 255, 255, 0.9); border: none; border-radius: 10px; padding: 12px; margin-bottom: 1rem; }
        .btn-ingresar { background-color: #2E5C31; color: white; font-weight: 600; border-radius: 10px; padding: 12px; width: 100%; border: none; transition: 0.3s; }
        .btn-ingresar:hover { background-color: #3E7A42; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <a href="/" class="btn-volver">← Menú Principal</a>
    <div class="login-card">
        <h1>La Selva</h1>
        <p class="mb-4">Ingresa a tu mesa para ordenar</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-danger" style="background: rgba(220,53,69,0.8); color: white; border: none; border-radius: 10px;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login-mesa" method="POST">
            <select name="numero_mesa" class="form-control" required>
                <option value="" disabled selected>Selecciona tu mesa...</option>
                {% for mesa in mesas %}
                    <option value="{{ mesa.numero }}">Mesa {{ mesa.numero }}</option>
                {% endfor %}
            </select>
            <input type="password" name="password" class="form-control" placeholder="Contraseña de la Mesa" required>
            <button type="submit" class="btn-ingresar mt-3">Ver la Carta</button>
        </form>
    </div>
</body>
</html>
