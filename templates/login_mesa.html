<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Ingreso de Mesa - La Selva</title>
    <style>
        body { background: linear-gradient(rgba(30, 61, 26, 0.8), rgba(30, 61, 26, 0.8)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1000'); background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; border-radius: 20px; width: 100%; max-width: 400px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="text-success text-decoration-none fw-bold mb-3 d-inline-block">← Volver al inicio</a>
        <h3 class="text-center fw-bold text-dark mb-4 mt-2">📍 Tu Ubicación</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %}{% for message in messages %}<div class="alert alert-danger text-center">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-muted fw-bold">Número de Mesa</label>
                <select name="mesa" class="form-select form-select-lg" required>
                    <option value="">Selecciona tu mesa...</option>
                    {% for m in mesas %}<option value="{{ m }}">Mesa {{ m }}</option>{% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-bold">Clave de Seguridad</label>
                <input type="password" name="password" class="form-control form-control-lg text-center text-success fw-bold" placeholder="****" required>
            </div>
            <button class="btn btn-success w-100 py-3 fw-bold rounded-pill fs-5">ENTRAR AL MENÚ</button>
        </form>
    </div>
</body>
</html>
