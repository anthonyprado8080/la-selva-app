<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Mesa - La Selva del Prado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { margin: 0; font-family: 'Poppins', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #e0e0e0; border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background-color: #1abc9c; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(26, 188, 156, 0.3); }
        button:hover { background-color: #16a085; transform: translateY(-2px); }
        .flash { color: #e74c3c; margin-bottom: 15px; font-size: 0.9rem; }
        
        /* ESTILO PARA EL BOTÓN DE REGRESAR */
        .btn-volver { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
        .btn-volver:hover { color: #1abc9c; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🍽️ Abre tu Mesa</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login-mesa" method="POST">
            <select name="numero_mesa" required>
                <option value="" disabled selected>Selecciona tu Mesa</option>
                {% for mesa in mesas %}
                    <option value="{{ mesa.numero }}">Mesa {{ mesa.numero }}</option>
                {% endfor %}
            </select>
            <input type="password" name="password" placeholder="Contraseña asignada" required>
            <button type="submit">Ver la Carta</button>
        </form>
        
        <!-- ENLACE PARA REGRESAR -->
        <a href="/" class="btn-volver">⬅ Volver al inicio</a>
    </div>
</body>
</html>
