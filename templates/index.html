<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Nuestra Carta - La Selva</title>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 90px; font-family: 'Segoe UI', sans-serif; }
        .navbar-selva { background-color: #1e3d1a; color: white; }
        .card-food { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; transition: transform 0.2s; }
        .card-food:hover { transform: translateY(-5px); }
        .food-img { height: 160px; object-fit: cover; width: 100%; }
        .bottom-bar { background: white; border-top: 1px solid #ddd; padding: 15px; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .input-cant { width: 70px; border-radius: 10px; border: 2px solid #198754; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-selva sticky-top shadow-sm px-3 py-2">
        <a href="/login-mesa" class="btn btn-outline-light btn-sm fw-bold">⬅ Cambiar Mesa</a>
        <span class="badge bg-success rounded-pill fs-6 border border-light">MESA {{ mesa_n }}</span>
    </nav>

    <div class="container py-4">
        <h2 class="fw-bold mb-4 text-dark text-center">🍽️ Nuestra Carta</h2>
        <form action="/enviar-pedido" method="POST">
            {% for cat in ['Comida', 'Bebida'] %}
            <h4 class="text-success border-bottom border-success pb-2 mt-4 fw-bold">{{ cat }}</h4>
            <div class="row row-cols-1 row-cols-md-2 g-4 mt-1">
                {% for item in menu if item.cat == cat %}
                <div class="col">
                    <div class="card h-100 card-food">
                        <img src="{{ item.img }}" class="food-img" alt="{{ item.nombre }}">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0 fw-bold">{{ item.nombre }}</h6>
                                <span class="text-success fw-bold fs-5">S/ {{ item.precio }}</span>
                            </div>
                            <div class="d-flex align-items-center">
                                <label class="text-muted fw-bold me-2 small">Cant:</label>
                                <input type="number" name="cant_{{ item.id }}" class="form-control input-cant" value="0" min="0" max="20">
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            {% endfor %}
            <div class="fixed-bottom bottom-bar">
                <div class="container">
                    <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold rounded-pill shadow">ENVIAR PEDIDO A COCINA 👨‍🍳</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
